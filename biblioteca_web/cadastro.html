<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Sistema de Cadastro - Início</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <header class="topbar">
    <a class="brand" href="#" aria-label="Biblioteca Koji">
      <span class="brand-icon">📙</span>
      <span>Koji</span>
    </a>

    <form class="search" id="searchForm">
      <label class="sr-only" for="searchInput">Buscar livros</label>
      <select aria-label="Tipo de busca">
        <option>Livros</option>
        <option>Autores</option>
        <option>Categorias</option>
      </select>
      <span class="search-icon">⌕</span>
      <input id="searchInput" type="search" placeholder="Buscar na biblioteca">
      <button type="submit" aria-label="Buscar">⌕</button>
    </form>

    <nav class="top-actions" aria-label="Atalhos">
      <a href="#catalogo" title="Catálogo">☺</a>
    </nav>
  </header>

  
  
   <nav class="main-nav" aria-label="Navegação principal">
     <a href="index.html">INÍCIO</a>
     <a href="consulta.html">CATÁLOGO</a>
     <a href="cadastro.html">CADASTRAR LIVRO</a>
   </nav>
  

  <main>

    <section class="stats" aria-label="Resumo do catálogo">
      <article class="stat-card">
        <span class="stat-icon">▤</span>
        <div><strong id="totalBooks">0</strong><span>Títulos cadastrados</span></div>
      </article>
      <article class="stat-card">
        <span class="stat-icon">♧</span>
        <div><strong id="totalCopies">0</strong><span>Exemplares no acervo</span></div>
      </article>
      <article class="stat-card">
        <span class="stat-icon">⌕</span>
        <div><strong id="totalCategories">0</strong><span>Categorias diferentes</span></div>
      </article>
    </section>

    <section class="content-grid">
      <section class="panel form-panel" id="cadastro">
        <div class="section-heading">
          <div>
            <span class="section-kicker">GERENCIAMENTO</span>
            <h2>Cadastrar livro</h2>
          </div>
          <span class="heading-icon">＋</span>
        </div>
        <p class="muted">Preencha os dados abaixo para adicionar um livro ao acervo.</p>

        <form id="bookForm">
          <div class="form-row">
            <div class="field field-wide">
              <label for="title">Título do livro *</label>
              <input id="title" name="title" type="text" placeholder="Ex.: O Pequeno Príncipe" required>
            </div>
            <div class="field">
              <label for="author">Autor(a) *</label>
              <input id="author" name="author" type="text" placeholder="Nome do autor" required>
            </div>
            <div class="field">
              <label for="year_publication">Ano de Publicação *</label>
              <input id="year" name="year" type="date" placeholder="Ex.: 06/04/1943" required>
            </div>
          </div>
          <div class="form-row">
            <div class="field">
              <label for="isbn">ISBN</label>
              <input id="isbn" name="isbn" type="text" placeholder="Ex.: 978-85-00-00000-0">
            </div>
            <div class="field">
              <label for="category">Gênero *</label>
              <select id="category" name="category" required>
                <option value="">Selecione uma categoria</option>
                <option>Literatura</option>
                <option>Fantasia</option>
                <option>Ficção científica</option>
                <option>Romance</option>
                <option>História</option>
                <option>Educação</option>
                <option>Tecnologia</option>
                <option>Infantil</option>
                <option>Outros</option>
              </select>
            </div>
            <div class="field field-small">
              <label for="quantity">Exemplares *</label>
              <input id="quantity" name="quantity" type="number" min="1" value="1" required>
            </div>
          </div>
          <div class="form-actions">
            <button class="button button-secondary" type="reset">Limpar</button>
            <button class="button button-primary" type="submit">＋ Adicionar livro</button>
          </div>
          <p class="form-message" id="formMessage" role="status"></p>
        </form>
      </section>

   
    
  </main>

<footer>
    <a class="footer-brand" href="#inicio">▱ Koji</a>
    <p>Biblioteca Koji · Sistema de cadastro de livros</p>
    <a href="#inicio">Voltar ao topo ↑</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
